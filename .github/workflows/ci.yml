name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app
      # No test place keeps Tokyo time, so a read of the machine's zone fails a test.
      - run: swift test
        env:
          TZ: Asia/Tokyo
